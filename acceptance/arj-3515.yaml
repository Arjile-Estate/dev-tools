# ARJ-3515 R3.E2 — The same crash with the Turbo summary not required → no missing-source warning, Error Cannot find module vite is shown and the exit is 2
# ARJ-3515 R3.E3 — Lint requires its Oxlint report oxlint.json, passes with exit 0 but writes no report → DEV-RESULT is PASS with the warning structured source oxlint.json is missing
# ARJ-3515 R4.E1 — The build of ui exits 1 and its adapter returns complete evidence with one TS2322 failure → the text has a line diagnostics structured and the JSON has mode structured
# ARJ-3515 R4.E2 — Dead-code validation exits 1 and its adapter prints not json at all → the text says diagnostics fallback with the reason malformed adapter response, the JSON has mode fallback with that reason, and a second run prints the same two lines
# ARJ-3515 R4.E3 — dev-tools build with the filter web fails in ui#build and exits 1 → the requested scope reads filter web, the failure names task ui#build, and the process exits 1
