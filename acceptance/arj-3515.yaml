# ARJ-3515 R1.E2 — Maison Fictive configures its adapter for lint:dead-code; Knip passes with exit 0 and the adapter reports one unused export as a warning, so DEV-RESULT is PASS with that one warning
# ARJ-3515 R1.E3 — Atelier Fictif enables DEV-RESULT for typecheck without an adapter; tsc prints error TS2304 Cannot find name Bail in src/lease.ts and exits 2 → DEV-RESULT shows that TS2304 line as the only failure and exits 2
# ARJ-3515 R2.E1 — The adapter reports TS2322 Type string is not assignable to type number in packages/ui/src/button.ts at line 12 column 5 for task ui#build → DEV-RESULT shows packages/ui/src/button.ts:12:5 with rule TS2322 and task ui#build
# ARJ-3515 R2.E2 — The adapter reports a no-debugger error in apps/web/src/quittance.ts at line 8 column 3 → the failure reads apps/web/src/quittance.ts:8:3 with rule no-debugger
